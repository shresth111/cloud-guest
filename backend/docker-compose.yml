services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguest-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - cloudguest_logs:/var/log/cloudguest
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguest-celery-worker
    # -Q celery,device_io: this one worker process consumes both the
    # default queue (every pure-DB Beat sweep) and the device_io queue
    # (app.core.celery_app.DEVICE_IO_QUEUE_NAME -- the real per-router/
    # per-link RouterOS device-I/O tasks app.core.celery_app.celery_app's
    # own task_routes routes there). Single-worker-multi-queue, not a
    # second worker service, is the simplest fix that actually separates
    # the two workloads at the queue level -- see that module's own
    # docstring for exactly which task names land on device_io and why. A
    # genuinely separate worker service/container per queue would fully
    # isolate device-I/O-bound tasks from pure-DB ones at the *process*
    # level too (one worker's device I/O backlog could never even compete
    # for the same worker slots as the other's DB sweeps) -- a real further
    # improvement, not implemented here to keep this change minimal.
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "celery,device_io",
      ]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - cloudguest_logs:/var/log/cloudguest
    restart: unless-stopped
    # Overrides the Dockerfile's HTTP healthcheck (it curls
    # :8000/health/live, which only the `api` service listens on) --
    # without this a worker with no HTTP server is permanently reported
    # "unhealthy" while correctly processing real jobs, which trains you
    # to ignore the one signal that is supposed to mean something.
    # `celery inspect ping` is the standard worker liveness check.
    # Kept byte-identical to deploy/docker-compose.prod.yml so the local
    # stack reports health the same way production does.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguest-celery-beat
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - cloudguest_logs:/var/log/cloudguest
    restart: unless-stopped
    # Same issue as celery-worker above -- beat has no HTTP server and no
    # `inspect ping` equivalent, so liveness is "is the pidfile's process
    # still running" instead. The --pidfile on the command above exists
    # for this check. Byte-identical to deploy/docker-compose.prod.yml.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: cloudguest-postgres
    environment:
      POSTGRES_DB: cloudguest
      POSTGRES_USER: cloudguest
      POSTGRES_PASSWORD: cloudguest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguest -d cloudguest"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudguest-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cloudguest-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cloudguest
      MINIO_ROOT_PASSWORD: cloudguest12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  cloudguest_logs:
  minio_data:

