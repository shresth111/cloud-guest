[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguest-backend"
version = "0.1.0"
description = "CloudGuest backend foundation for a cloud-managed MikroTik network operating system."
requires-python = ">=3.13"
readme = "README.md"
authors = [{ name = "CloudGuest Engineering" }]
dependencies = [
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "asyncpg==0.30.0",
    "celery[redis]==5.5.3",
    "cryptography==44.0.0",
    "email-validator==2.2.0",
    "fastapi==0.115.6",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "openpyxl==3.1.5",
    "prometheus-client==0.25.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.1",
    "razorpay==2.0.1",
    "redis==5.2.1",
    "reportlab==4.4.4",
    "SQLAlchemy==2.0.36",
    "stripe==15.3.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"
# vendor/ is a third-party package's source, vendored verbatim into the
# Docker build context (see the commit that added vendor/wyfy-device-gateway)
# -- lint this team's own code against these rules, not an upstream
# package's own style.
# ops/hub-agents/ is a byte-for-byte capture of the three services running
# on the WireGuard/RADIUS hub. Their source existed in no repository at all
# until it was rescued from a VM that has since been deallocated. Reformatting
# it would make this copy differ from what is actually deployed, which defeats
# the point of capturing it -- so lint this team's own code, not the capture.
exclude = ["vendor", "ops/hub-agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS email markup and RouterOS one-liner script bodies -- wrapping
# hurts readability far more than it helps.
"app/core/email_layout.py" = ["E501"]
"app/domains/network_config/wan/renderers.py" = ["E501"]

