! pmacct nfacctd -- Wyfy hub NetFlow/IPFIX collector.
! Design: ~/wyfy-ops/netflow/DESIGN.md §4. NOT DEPLOYED. The hub is a prod
! box: installing this is the owner's call (apt install pmacct, Debian 12).
!
! Listens ONLY on the hub's WireGuard tunnel address. Routers export over
! wg0 from their own tunnel address, which WireGuard binds to the peer's key,
! so the exporter address is trustworthy and nothing is exposed publicly.
! The host firewall (flow-agent-firewall.sh) additionally drops UDP 2055
! from anywhere but 10.20.0.0/24 on wg0.
!
! Output: two JSON files per 5-minute window under /var/spool/wyfy-flows/,
! from two print plugins that see the same records:
!
!   <YYYYMMDD-HHMM>.json          plugin "wyfy": rows aggregated on
!       (exporter, src, dst, protocol, src port, dst port). The rollups the
!       app has always ingested. Its aggregate keys are unchanged.
!   records-<YYYYMMDD-HHMM>.json  plugin "wyfyflows": one row per exported
!       flow record, with the router's start and end times and the NAT
!       translation. Feeds the app's flow table (the agent's "flow_rows").
!
! Why two plugins and not one wider aggregate: the timestamps are part of
! the cache key, so a plugin that carries them merges nothing -- every
! exported record is its own row. Putting them on the rollup plugin would
! multiply the rows of the file the live app ingests every 5 minutes and
! change what a row in it means. A second instance leaves that file exactly
! as it was and gives the per-flow rows their own cache, file and limits.
!
! flow_agent.py serves complete windows to the app server and deletes both
! kinds of file after 2 hours. DEPLOY THE NEW AGENT BEFORE THIS CONFIG: an
! older agent neither serves nor prunes records-*.json.

daemonize: false
logfile: /var/log/wyfy-nfacctd.log

nfacctd_ip: 10.20.0.1
nfacctd_port: 2055
! Bin by collector arrival time, not the router's clock: venue routers'
! clocks are not trusted (see the NTP findings in the router runbooks).
nfacctd_time_new: true
! IPFIX is template-based: a record cannot be decoded until its template has
! been seen, and RouterOS resends templates only periodically. Without this
! file every collector restart drops records until each router's next
! template. The directory must be writable by the service user.
nfacctd_templates_file: /var/lib/wyfy-nfacctd/templates.json
! Every timestamp in the output as seconds since the Epoch (with the
! sub-second part), so no reader has to know the hub's time zone. The app
! reads the per-flow timestamp_* keys; the rollup rows' stamp_* keys are not
! forwarded by the agent, so nothing that is ingested today changes.
timestamps_since_epoch: true

plugins: print[wyfy], print[wyfyflows]

! ===========================================================================
! Plugin "wyfy": the rollups (unchanged apart from the flows counter)
! ===========================================================================
! proto + both ports feed the per-service view. BOTH ports are needed: the
! service is the REMOTE end's port, which is dst_port on an upload record
! and src_port on a download record, and only the app (which knows which
! side is the venue) can tell them apart. Cost: the client's ephemeral port
! makes rows nearly per-flow, so this file and the hub -> app transfer grow
! accordingly. UNMEASURED (hardware check H4); if it is too much, collapse
! the ephemeral side in flow_agent.py before serving.
! JSON keys this produces: ip_proto, port_src, port_dst. pmacct prints
! ip_proto as a name (tcp/udp/icmp) by default; the app accepts names and
! numbers.
! "flows" is a counter, not a key: it adds no rows. pmacct writes the
! "flows" JSON key ONLY when the word is in the aggregate, so without it the
! agent has been forwarding flows = 0 for every row.
aggregate[wyfy]: peer_src_ip, src_host, dst_host, proto, src_port, dst_port, flows
print_output[wyfy]: json
print_output_file[wyfy]: /var/spool/wyfy-flows/%Y%m%d-%H%M.json
! true, not the default false. When the cache below fills before the 5 minutes
! are up, nfacctd does NOT drop: it purges early ("Finished cache entries
! (ie. print_cache_entries). Purging." in the log) and writes what it holds to
! this window's file, then carries on and writes the rest at the normal
! purge. With append off the second write REPLACES the first and the early
! part of the window is silently lost (pmacct itself warns "Make sure
! print_output_file_append is set to true"). With append on, both parts are
! in the file; a key can then appear on two lines, which the app sums.
print_output_file_append[wyfy]: true
print_refresh_time[wyfy]: 300
print_history[wyfy]: 5m
print_history_roundoff[wyfy]: m
! --- Memory (this plugin; the total for both is at the end of the file). The
! hub has 2 GB, no swap, and carries RADIUS and WireGuard for every venue.
!
! print_cache_entries is the number of hash BUCKETS, and nfacctd allocates the
! whole structure at start, used or not. From pmacct 1.7.7
! src/plugin_common.c (P_init_default_values), with AVERAGE_CHAIN_LEN = 10 and
! sizeof(struct chained_cache) = 352 bytes on amd64:
!
!   base cache memory = E*352            the buckets
!                     + 10*E*352         the scratch area for conflict chains
!                     + 2*(11*E)*8       two pointer queues
!                     = E * 4048 bytes
!
! It does NOT depend on the aggregate (the entry is a fixed struct; only BGP,
! NAT, MPLS and tunnel primitives are allocated extra, and none is used here)
! and it does NOT include plugin_pipe_size, which is a separate 10 MB queue.
!
!   262139 (the value this file used to carry) * 4048 = 1,061,138,672 bytes
!     -- exactly the "base cache memory" nfacctd logged on the hub, where used
!        memory went from 506 MB to 1480 MB.
!   16411 (pmacct's own default)             * 4048 =    66,431,728 bytes
!     = 63 MiB, plus the 10 MB pipe = about 76 MB at start.
!
! Capacity: 16411 buckets + 164110 chained = up to about 180,000 distinct rows
! per window (pmacct's CONFIG-KEYS says "approx 150K" for this value).
! Demand: rows are at most one per flow. DESIGN.md §5 assumes 10 flows/s per
! venue on average: 15 routers * 10 * 300 s = 45,000 rows per window, a third
! of the conservative capacity. Its peak assumption (100 flows/s at every
! venue at once) would be 450,000 and would purge early about three times a
! window -- handled by append above, not lost. Both rates are ASSUMPTIONS
! (hardware check H4); grep the log for "Finished cache entries" to see
! whether it ever happens. Do not raise this without redoing the sum:
! `python3 check_nfacctd_memory.py nfacctd.conf` prints it and fails over
! budget. The unit also sets MemoryMax as a backstop.
print_cache_entries[wyfy]: 16411
plugin_pipe_size[wyfy]: 10240000
plugin_buffer_size[wyfy]: 10240

! ===========================================================================
! Plugin "wyfyflows": one row per exported flow record
! ===========================================================================
! JSON keys (pmacct 1.7.7 src/plugin_cmn_json.c): peer_ip_src, ip_src,
! ip_dst, ip_proto, port_src, port_dst, post_nat_ip_src, post_nat_ip_dst,
! post_nat_port_src, post_nat_port_dst, timestamp_start, timestamp_end,
! timestamp_arrival, bytes, packets, flows. flow_agent.py forwards exactly
! these; `check_nfacctd_memory.py --agent ...` fails if the two disagree.
!
! What a row is: ONE exported record in ONE direction. RouterOS exports each
! direction separately and re-exports a long flow every active-flow-timeout
! (1 minute), so one download is many rows. Nothing here pairs or stitches.
!
! post_nat_*: IPv4 only. The routers' IPv4 template carries elements 225 to
! 228 (read from the templates file on the hub, 2026-10-13); the IPv6
! template has none, and pmacct then prints a zero address and port, which
! the app stores as "not recorded".
!
! timestamp_start / timestamp_end are the ROUTER's times. The routers send
! them as sysUpTime offsets (elements 22 and 21). pmacct 1.7.7 turns those
! into a time only together with element 160 (systemInitTimeMilliseconds)
! in the same record; otherwise it silently writes the export packet's
! header time into both, so start equals end. Whether real rows carry true
! start and end times is UNVERIFIED and only a spool row can show it:
! compare timestamp_start with timestamp_end, and both with
! timestamp_arrival (the collector's own clock, kept for exactly this).
! nfacctd_time_new above still decides the 5-minute file a row lands in.
!
! nat_event: routers with `nat-events=yes` (Farmao since 2026-10-18) also
! send conntrack NAT events as their own template (1025 on the fleet:
! elements 4, 7, 8, 11, 12, 225-228, 230 natEvent, 323 observationTime).
! pmacct classifies a template carrying 230 as a NAT event and feeds it to
! every plugin, so these rows were ALREADY in records-*.json before this
! key: bytes 0, packets 0, timestamp_start = the observation time, but no
! event type. This key adds the type (1/2, 4/5 = create/delete). A traffic
! record prints nat_event 0. No extra memory: the field lives in the NAT
! primitives struct this plugin already allocates per entry.
aggregate[wyfyflows]: peer_src_ip, src_host, dst_host, proto, src_port, dst_port, post_nat_src_host, post_nat_dst_host, post_nat_src_port, post_nat_dst_port, nat_event, timestamp_start, timestamp_end, timestamp_arrival, flows
print_output[wyfyflows]: json
! Same directory as the rollups (the unit creates and owns only that one);
! the "records-" prefix is how flow_agent.py tells the two apart.
print_output_file[wyfyflows]: /var/spool/wyfy-flows/records-%Y%m%d-%H%M.json
! Required here, not optional: this plugin's cache WILL fill at a busy venue
! (see below), and without append each early purge would be overwritten.
print_output_file_append[wyfyflows]: true
print_refresh_time[wyfyflows]: 300
print_history[wyfyflows]: 5m
print_history_roundoff[wyfyflows]: m
! --- Memory and capacity of this plugin.
!
!   base cache memory = E * 4048 bytes, allocated at start (as above):
!     8209 * 4048 = 33,230,032 bytes = 32 MiB
!   pipe            = 10,240,000 bytes
!   per USED entry  = about 128 bytes more. The NAT fields and the timestamps
!     live in a struct pkt_nat_primitives that pmacct mallocs per used entry
!     and frees at purge (about 112 bytes, 128 with allocator overhead;
!     computed from the struct, not measured).
!     Full cache: 90,299 entries * 128 = 11,558,272 bytes = 11 MiB.
!
! Capacity: 8209 buckets + 82,090 chained = 90,299 rows per purge. Every
! exported record is its own entry here (the timestamps are in the key), so
! capacity is rows, not conversations.
! Demand, ALL ASSUMED (COLLECTOR-FLOW-FIELDS.md section 2): a 50-guest venue
! produces about 6,000 rows per 5 minutes when idle and about 75,000 when
! every guest is browsing hard. So this holds one venue at its worst, or
! fifteen at the low figure (90,000). Two venues export today.
! When it fills: nothing is dropped. nfacctd logs "Finished cache entries
! (ie. print_cache_entries). Purging.", appends what it holds to the window's
! file and carries on; the window's file is simply written in several parts.
! Fifteen venues at the high figure (1.1 million rows) would purge about
! twelve times a window. That costs CPU and disk on the hub, not rows; the
! real limit then is downstream (about 300 bytes a row through the spool,
! the agent and the app), and flow_agent.py caps what it serves per window.
! The real row count is one `wc -l` on a records-*.json file. MEASURE IT
! before raising this.
print_cache_entries[wyfyflows]: 8209
plugin_pipe_size[wyfyflows]: 10240000
plugin_buffer_size[wyfyflows]: 10240

! ===========================================================================
! Total memory, both plugins, against the unit's MemoryMax=256M
! ===========================================================================
!   wyfy       base 66,431,728 + pipe 10,240,000             =  76,671,728
!   wyfyflows  base 33,230,032 + pipe 10,240,000             =  43,470,032
!   at start                                                 = 120,141,760
!   wyfyflows cache full: 90,299 * 128                       =  11,558,272
!   worst case                                               = 131,700,032
! That is 126 MiB of the 256 MiB ceiling: under half, leaving the rest for
! the core process, the template cache and the short-lived writer processes
! each purge forks. `python3 check_nfacctd_memory.py nfacctd.conf --unit
! ../hub-agents/systemd/wyfy-nfacctd.service --agent
! ../hub-agents/flow_agent.py` redoes this sum and fails when the worst case
! is over 60% of MemoryMax, or when the agent and this file disagree on keys.

! --- Phase 3, NOT ENABLED: NAT archive (DESIGN.md §6) ----------------------
! A long-lived archive, as opposed to the 2-hour spool above. Still needs
! legal sign-off (retention period, who may read) and the owner's OK
! for the S3 bucket. Shape, for review only:
! plugins: print[wyfy], print[wyfyflows], print[natlog]
! aggregate[natlog]: peer_src_ip, src_host, src_port, dst_host, dst_port, proto, post_nat_src_host, post_nat_src_port, timestamp_start, timestamp_end
! print_output[natlog]: csv
! print_output_file[natlog]: /var/spool/wyfy-natlog/%Y%m%d-%H.csv
! print_refresh_time[natlog]: 3600
