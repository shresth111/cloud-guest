# sites-enabled/wyfy-aruba-shared -- the SHARED Aruba Instant On listener.
#
# An Instant On venue's public address is not stable (dynamic IP, dual WAN,
# failover; measured 2026-10-03: one office, two egress IPs an hour apart),
# and FreeRADIUS picks a client by source address. This server therefore
# listens on its OWN ports with its OWN client list -- one catch-all client
# per address family, one platform-wide shared secret, Message-Authenticator
# required -- and leaves "which venue is this?" to the backend, which reads
# it from INSIDE the packet: NAS-Identifier (cg-aruba-<8hex>) must name an
# ACTIVE aruba_instant_on NAS, and the AP MAC at the front of
# Called-Station-Id must equal that device's recorded AP MAC
# (app.domains.guest.aruba_shared.resolve_shared_nas).
#
# What this does NOT change: the default server's 1812/1813 listeners and
# every client{} in clients.conf. A `clients = ...` list on a listen section
# is that socket's ONLY client list, so the catch-all below is invisible to
# 1812/1813 -- unlike the `cloudguest-dynamic-wan` 0.0.0.0/0 stanza removed
# from clients.conf on 2026-09-13, which every listener matched and which
# carried one fixed identity.
#
# Needs, beside this file:
#   * ${confdir}/wyfy-aruba-shared-clients.conf -- written ONLY by
#     radius_agent.py `POST /radius/shared-client` (set_shared_secret). The
#     installer creates it with an unguessable placeholder secret, so the
#     listener rejects everything until the platform sets a real one.
#   * mods-enabled/rest_aruba -- rest.conf with the instance renamed
#     `rest rest_aruba` and the two URIs pointing at
#     /radius/aruba-shared/{authorize,accounting} (deploy/staging-radius/
#     gen_site.py derives it, so it can never drift from rest.conf).

clients wyfy_aruba_shared {
$INCLUDE ${confdir}/wyfy-aruba-shared-clients.conf
}

server wyfy_aruba_shared {
	listen {
		type = auth
		ipaddr = *
		port = 1912
		clients = wyfy_aruba_shared
	}
	listen {
		type = acct
		ipaddr = *
		port = 1913
		clients = wyfy_aruba_shared
	}
	listen {
		type = auth
		ipv6addr = ::
		port = 1912
		clients = wyfy_aruba_shared
	}
	listen {
		type = acct
		ipv6addr = ::
		port = 1913
		clients = wyfy_aruba_shared
	}

	authorize {
		#  backend_secret proves the request came through THIS listener
		#  (FreeRADIUS has already verified the packet's Message-Authenticator
		#  with the RADIUS secret). It is NOT the RADIUS secret -- every Aruba
		#  customer types that one into Instant On -- but a hub-only value the
		#  agent derives from it with RADIUS_AGENT_SECRET
		#  (radius_agent.shared_backend_secret). The other two are the
		#  packet's own claims; the backend checks them against the NAS row
		#  and the device's AP MAC. Plain attribute references only
		#  (README.md bug #2: no nested %{...}).
		update control {
			REST-HTTP-Header += "X-RADIUS-Shared-Secret: %{client:backend_secret}"
			REST-HTTP-Header += "X-RADIUS-Packet-NAS-Identifier: %{NAS-Identifier}"
			REST-HTTP-Header += "X-RADIUS-Called-Station-Id: %{Called-Station-Id}"
		}
		rest_aruba
		update reply {
			Message-Authenticator := 0x00
		}
	}

	#  rest_aruba sets control:Auth-Type to Accept or Reject; both are
	#  handled by the server core, so there is nothing to authenticate here.
	authenticate {
	}

	post-auth {
		Post-Auth-Type REJECT {
			update reply {
				Message-Authenticator := 0x00
			}
		}
	}

	accounting {
		#  Identical to sites-default.snippets.conf's accounting{}, except for
		#  the identity headers and the rest instance.
		if (!&Acct-Input-Octets) {
			update request { Acct-Input-Octets := 0 }
		}
		if (!&Acct-Output-Octets) {
			update request { Acct-Output-Octets := 0 }
		}
		if (!&Acct-Input-Gigawords) {
			update request { Acct-Input-Gigawords := 0 }
		}
		if (!&Acct-Output-Gigawords) {
			update request { Acct-Output-Gigawords := 0 }
		}
		if (!&Acct-Session-Id) {
			update request { Acct-Session-Id := "" }
		}
		if (!&User-Name) {
			update request { User-Name := "" }
		}
		update control {
			Tmp-String-0 := "%{tolower:%{Acct-Status-Type}}"
			Tmp-String-1 := "%{%{Acct-Terminate-Cause}:-}"
			Tmp-Integer64-0 := "%{expr:(%{Acct-Input-Gigawords} * 4294967296) + %{Acct-Input-Octets}}"
			Tmp-Integer64-1 := "%{expr:(%{Acct-Output-Gigawords} * 4294967296) + %{Acct-Output-Octets}}"
			REST-HTTP-Header := "X-RADIUS-Shared-Secret: %{client:backend_secret}"
			REST-HTTP-Header += "X-RADIUS-Packet-NAS-Identifier: %{NAS-Identifier}"
			REST-HTTP-Header += "X-RADIUS-Called-Station-Id: %{Called-Station-Id}"
		}
		rest_aruba {
			invalid = 1
			reject = 1
		}
		#  Always acknowledge: an AP that never gets an Accounting-Response
		#  retransmits forever. A refused packet is logged by the backend
		#  (radius_aruba_shared_rejected) and recorded against nothing.
		if (!(ok || updated)) {
			ok
		}
	}
}
