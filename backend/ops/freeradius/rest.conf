# /etc/freeradius/3.0/mods-available/rest on the hub VM (symlinked into
# mods-enabled/). No secrets in this file -- the per-NAS auth headers are
# resolved from the matched client{} stanza in sites-default.snippets.conf's
# unlang instead. See README.md for the two real rlm_rest bugs that shaped
# this file's exact syntax (quoting + no nested %{...} inside `data`) before
# changing it.

rest {
	tls {
	}

	#  !! THE ONE ENVIRONMENT-SPECIFIC VALUE IN THIS FILE. Check it before
	#  !! applying anything here to a hub.
	#
	#  The platform API's private address, reached over the VPC. Plain HTTP;
	#  it never leaves the private network.
	#
	#  This read `http://10.30.1.10:8000/api/v1` until 2026-09-11 -- an
	#  *Azure* VNet address, left behind when production moved to AWS
	#  ap-south-1 on 2026-08-27. Nothing detected it, because nothing in this
	#  repo is applied automatically and nothing compares this file to the
	#  hub: `radiusd -XC` validates a syntactically perfect config that points
	#  at an address no longer routable, and rlm_rest then fails every
	#  authorize AND every accounting request with "Server returned no data".
	#  Anyone who had followed README.md's apply steps with the old value
	#  would have taken RADIUS down for the whole fleet.
	#
	#  172.31.38.118 is `wyfy-app-server` (i-0cf9b79511abe6000) in the AWS
	#  VPC, verified 2026-09-11. It is a *private* IP on a specific instance
	#  and will move if that instance is replaced -- `verify_hub_config.py
	#  --expect-api-cidr 172.31.0.0/16` is the check that catches the next
	#  drift instead of a venue catching it.
	connect_uri = "http://172.31.38.118:8000/api/v1"

	authorize {
		uri = "${..connect_uri}/radius/authorize"
		method = 'post'
		body = 'json'
		data = "{\"username\": \"%{User-Name}\", \"calling_station_id\": \"%{Calling-Station-Id}\"}"
		tls = ${..tls}
	}

	#  Every value below is a flat scratch attribute computed by unlang in
	#  sites-available/default's accounting{} BEFORE this module runs --
	#  see sites-default.snippets.conf. Nothing here may contain a nested
	#  %{...}; this build's `data` parser cannot expand one and drops the
	#  packet without a usable error (README.md bug #2).
	#
	#  Totals, not deltas. RADIUS has no delta attribute: Acct-Input-Octets
	#  and Acct-Output-Octets are running session totals (RFC 2866
	#  s5.3-5.4). The previous revision of this file mapped them onto the
	#  backend's `bytes_uploaded_delta`/`bytes_downloaded_delta`, which
	#  would have made every interim update re-add the entire session to
	#  date. `RadiusService.accounting_interim_update` converts a total to
	#  a delta against what it has already recorded, which also makes a
	#  RADIUS retransmit a no-op instead of a double-count.
	accounting {
		uri = "${..connect_uri}/radius/accounting"
		method = 'post'
		body = 'json'
		data = "{\"status_type\": \"%{control:Tmp-String-0}\", \"username\": \"%{User-Name}\", \"session_id\": \"%{Acct-Session-Id}\", \"bytes_uploaded_total\": %{control:Tmp-Integer64-0}, \"bytes_downloaded_total\": %{control:Tmp-Integer64-1}, \"disconnect_reason\": \"%{control:Tmp-String-1}\"}"
		tls = ${..tls}
	}

	# start/min raised from the packaged defaults (which resolved to 0/0 on
	# this build) -- a cold/empty pool meant the first handful of requests
	# after every restart failed with "Server returned no data" until it
	# warmed up. Keeping min=5 permanently warm avoids that window
	# entirely instead of just tolerating it via client-side retry.
	pool {
		start = 5
		min = 5
		max = 20
		spare = 5
		uses = 0
		retry_delay = 30
		lifetime = 0
		idle_timeout = 60
	}
}
