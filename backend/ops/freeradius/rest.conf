# /etc/freeradius/3.0/mods-available/rest on cloudguest-vm (symlinked into
# mods-enabled/). No secrets in this file -- the NAS auth headers live in
# sites-default.snippets.conf's unlang instead. See README.md for the two
# real bugs that shaped this file's exact syntax (quoting + no nested
# %{...} inside `data`) before changing it.

rest {
	connect_uri = "http://127.0.0.1:8000/"

	authorize {
		uri = "${..connect_uri}api/v1/radius/authorize"
		method = 'post'
		body = 'json'
		force_to = 'json'
		data = "{\"username\": \"%{User-Name}\", \"calling_station_id\": \"%{Calling-Station-Id}\"}"
	}

	accounting {
		uri = "${..connect_uri}api/v1/radius/accounting"
		method = 'post'
		body = 'json'
		force_to = 'json'
		data = "{\"status_type\": \"%{control:Tmp-String-0}\", \"username\": \"%{User-Name}\", \"session_id\": \"%{Acct-Session-Id}\", \"bytes_uploaded_delta\": %{Acct-Input-Octets}, \"bytes_downloaded_delta\": %{Acct-Output-Octets}, \"bytes_uploaded_total\": %{Acct-Input-Octets}, \"bytes_downloaded_total\": %{Acct-Output-Octets}}"
	}

	# start/min raised from the packaged defaults (which resolved to 0/0 on
	# this build) -- a cold/empty pool meant the first handful of requests
	# after every restart failed with "Server returned no data" until it
	# warmed up. Keeping min=5 permanently warm avoids that window
	# entirely instead of just tolerating it via client-side retry.
	pool {
		start = 5
		min = 5
		max = 20
		spare = 5
		uses = 0
		lifetime = 0
		idle_timeout = 0
		retry_delay = 1
	}
}
