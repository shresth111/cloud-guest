# Real diff against Ubuntu's stock /etc/freeradius/3.0/sites-available/default
# on cloudguest-vm -- NOT a drop-in file, these two blocks are inserted at
# the *start* of the existing authorize{}/accounting{} sections (before
# Ubuntu's own filter_username/preprocess/etc), everything else in that
# 700-line file is untouched stock config. See README.md for why the
# accounting block's unlang looks the way it does (the two real rlm_rest
# parser bugs found fixing this).
#
# <NAS-IDENTIFIER>/<NAS-SHARED-SECRET> below are real per-NAS values from
# radius_nas_clients -- redacted here on purpose. In production these are
# literal (rlm_rest's `data`/header config items can't read this NAS's own
# client{} secret back out via any built-in xlat), one `update control`
# block per registered NAS, guarded by `if ("%{NAS-Identifier}" ==
# "<value>")` once there's more than one -- with exactly one real NAS as
# of this writing there's just the one unconditional block currently
# deployed.

authorize {
	update control {
		REST-HTTP-Header := "X-RADIUS-NAS-Identifier: <NAS-IDENTIFIER>"
		REST-HTTP-Header += "X-RADIUS-Shared-Secret: <NAS-SHARED-SECRET>"
	}
	rest
	#
	#  (Ubuntu's own stock authorize{} contents continue unchanged from here)
}

accounting {
	# rlm_rest's `data` template (rest.conf) can only reference flat,
	# already-resolved attributes -- these two guards give
	# Acct-Input-Octets/Acct-Output-Octets a real value before rest runs,
	# since a RADIUS Accounting-Start packet often omits both (nothing to
	# report yet) and referencing an unset attribute in `data` produces a
	# bare `, "bytes_uploaded_delta": ,` -- invalid JSON, backend 400s,
	# rlm_rest logs it as "Server returned no data" either way.
	if (!&Acct-Input-Octets) {
		update request {
			Acct-Input-Octets := 0
		}
	}
	if (!&Acct-Output-Octets) {
		update request {
			Acct-Output-Octets := 0
		}
	}
	update control {
		# Tmp-String-0 is one of FreeRADIUS's own built-in scratch
		# attributes (no dictionary changes needed) -- computing the
		# lowercased status here, in an `update` assignment, works; the
		# identical %{tolower:%{Acct-Status-Type}} expression inline
		# inside rest.conf's `data` string does not (see README.md).
		Tmp-String-0 := "%{tolower:%{Acct-Status-Type}}"
		REST-HTTP-Header := "X-RADIUS-NAS-Identifier: <NAS-IDENTIFIER>"
		REST-HTTP-Header += "X-RADIUS-Shared-Secret: <NAS-SHARED-SECRET>"
	}
	rest
	#  (Ubuntu's own stock accounting{} contents continue unchanged from here)
}
