# Real diff against Ubuntu's stock /etc/freeradius/3.0/sites-available/default
# on the hub VM -- NOT a drop-in file. These two blocks are inserted into the
# existing authorize{}/accounting{} sections; everything else in that
# ~700-line file is untouched stock config. See README.md for why the
# accounting block's unlang looks the way it does (the two real rlm_rest
# parser bugs found fixing this, plus the rcode handling below).
#
# NOTHING in this file is a secret. Per-NAS identity is resolved at request
# time from whichever client{} stanza matched the packet's source IP, via
# %{client:shortname} / %{client:backend_secret} -- radius_agent.py writes
# both into every stanza it creates. An earlier revision of this file used
# one hardcoded `update control` block per NAS and is why every router but
# the first silently 401'd.
#
# !! The live sites-available/default is AHEAD of this repo. Do not copy this
# !! file over it. Apply the accounting{} block as a targeted insertion.

authorize {
	#  (this block is inserted immediately before Ubuntu's own `chap`, i.e.
	#  after filter_username/preprocess -- it is already deployed live and
	#  is reproduced here only as the worked example the accounting block
	#  below follows)
	update control {
		REST-HTTP-Header += "X-RADIUS-NAS-Identifier: %{client:shortname}"
		REST-HTTP-Header += "X-RADIUS-Shared-Secret: %{client:backend_secret}"
	}
	rest

	#  Forces the packet encoder to compute a real Message-Authenticator
	#  over an rlm_rest-built Access-Accept; RouterOS discards replies
	#  without one. Confirmed live 2026-08-18 by packet capture.
	update reply {
		Message-Authenticator := 0x00
	}
}

accounting {
	#  Ubuntu's stock `detail` runs FIRST, before any of this. That
	#  ordering is load-bearing: if the backend is unreachable, the
	#  Accounting-Request is already written to
	#  /var/log/freeradius/radacct/<nas-ip>/detail-<date> and can be
	#  replayed. Do not move this block above `detail`.

	#  rlm_rest's `data` template can only reference flat, already-resolved
	#  attributes on this build (README.md bug #2), and an unset attribute
	#  renders as nothing at all -- producing `"bytes_uploaded_total": ,`,
	#  invalid JSON, and a backend 400 that rlm_rest reports only as
	#  "Server returned no data". A real Accounting-Start carries none of
	#  the octet counters (there is nothing to report yet) and
	#  Accounting-On/Off carry neither User-Name nor Acct-Session-Id, so
	#  every field the template touches gets a guard.
	if (!&Acct-Input-Octets) {
		update request { Acct-Input-Octets := 0 }
	}
	if (!&Acct-Output-Octets) {
		update request { Acct-Output-Octets := 0 }
	}
	if (!&Acct-Input-Gigawords) {
		update request { Acct-Input-Gigawords := 0 }
	}
	if (!&Acct-Output-Gigawords) {
		update request { Acct-Output-Gigawords := 0 }
	}
	if (!&Acct-Session-Id) {
		update request { Acct-Session-Id := "" }
	}
	if (!&User-Name) {
		update request { User-Name := "" }
	}
	update control {
		#  Tmp-* are FreeRADIUS's own built-in scratch attributes -- no
		#  dictionary changes needed. Compound xlat works HERE, inside an
		#  `update` assignment; the identical expression inline in
		#  rest.conf's `data` string does not (README.md bug #2).
		Tmp-String-0 := "%{tolower:%{Acct-Status-Type}}"
		Tmp-String-1 := "%{%{Acct-Terminate-Cause}:-}"

		#  Octet counters are 64-bit on the wire but split across two
		#  attributes: Acct-*-Octets is the low 32 bits and wraps every
		#  4 GiB, Acct-*-Gigawords is the high word (RFC 2869 s5.1-5.2).
		#  Sending Acct-Input-Octets alone silently truncates every
		#  session past 4 GiB back to near zero -- which on a guest-WiFi
		#  data cap reads as "this guest has used nothing" precisely when
		#  they have used the most.
		Tmp-Integer64-0 := "%{expr:(%{Acct-Input-Gigawords} * 4294967296) + %{Acct-Input-Octets}}"
		Tmp-Integer64-1 := "%{expr:(%{Acct-Output-Gigawords} * 4294967296) + %{Acct-Output-Octets}}"

		REST-HTTP-Header := "X-RADIUS-NAS-Identifier: %{client:shortname}"
		REST-HTTP-Header += "X-RADIUS-Shared-Secret: %{client:backend_secret}"
	}

	rest {
		#  4xx only. The backend understood the request and refused it
		#  (unknown NAS, no such session, malformed payload) -- resending
		#  the identical packet cannot change that answer, so continue to
		#  the `ok` below and acknowledge, rather than leaving the NAS to
		#  retransmit the same rejected packet until it gives up.
		#
		#  `fail` (5xx, connection refused, timeout) is deliberately NOT
		#  listed. It keeps its default `return`, accounting{} returns
		#  fail, and FreeRADIUS sends NO Accounting-Response at all. The
		#  NAS then retransmits, which is exactly what a transient
		#  backend outage needs and is the whole reason RADIUS accounting
		#  is acknowledged. Acking a packet we could not record would
		#  destroy the usage data silently.
		invalid = 1
		reject = 1
	}
	if (!(ok || updated)) {
		#  Reached only on 4xx. Not silent: rlm_rest has already logged an
		#  ERROR line naming the status code, and the Module-Failure-Message
		#  it set is in the detail file written above.
		ok
	}

	#  (Ubuntu's own stock unix / -sql / exec / attr_filter.accounting_response
	#  continue unchanged from here)
}
