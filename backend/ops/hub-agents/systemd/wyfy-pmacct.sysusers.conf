# /etc/sysusers.d/wyfy-pmacct.conf
#
# Debian's pmacct package creates no "pmacct" user, and wyfy-nfacctd.service
# and flow-agent.service both run as it (start fails with 217/USER without).
# Apply with `systemd-sysusers` (it also runs at boot). A no-op when the user
# already exists.
u pmacct - "Wyfy flow collector" /nonexistent /usr/sbin/nologin
