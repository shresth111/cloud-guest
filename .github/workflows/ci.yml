name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  # cd.yml calls this instead of restating ruff/pytest/the test-count floor.
  # The gates stay defined once, here, and a deploy cannot pass a version of
  # them that has drifted from the one PRs run.
  workflow_call:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Two heads is not a lint nit here: the api image runs
      # `alembic upgrade head` in its CMD, so shipping the api IS running a
      # migration. A branched history makes that command refuse outright,
      # which crash-loops the container, fails remote-deploy.sh's health
      # wait and rolls back -- after the pre-deploy dump has already run.
      #
      # It has happened twice: an earlier `fix/alembic-two-heads` branch,
      # and again when 0117 was merged without rebasing its down_revision
      # off 0113 (this PR). Both times `main` carried it, because nothing
      # checked. Two PRs adding a migration in the same window is all it
      # takes, and neither PR looks wrong on its own.
      #
      # ScriptDirectory reads the versions directory only -- no database,
      # no env.py, so this cannot fail for an unrelated connection reason
      # and cannot be confused for one.
      - name: Assert Alembic has exactly one head
        run: |
          python - <<'EOF'
          import sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          for h in heads:
              print("head: " + h)
          if len(heads) != 1:
              print("::error::Alembic has %d heads; `alembic upgrade head` will "
                    "refuse and any api deploy will crash-loop. Rebase the newer "
                    "revision's down_revision onto the other head." % len(heads))
              sys.exit(1)
          print("one head, as required")
          EOF

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --junitxml=junit.xml

      # The suite has always gone green on every PR, which is exactly why
      # nobody noticed a branch drop from 2,924 collected tests to 2,868 --
      # 56 tests vanished and 29 of the survivors failed, while the summary
      # kept the shape it always had. Green-but-smaller is the failure mode
      # this repo actually has, so assert the count, not just the exit code.
      #
      # Raise MIN_TESTS when the real count moves up. It is a ratchet, not a
      # target -- a floor that drifts down with the suite protects nothing.
      - name: Assert the suite did not shrink
        env:
          MIN_TESTS: "2900"
        run: |
          total=$(python - <<'EOF'
          import xml.etree.ElementTree as ET
          r = ET.parse("junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          print(int(s.get("tests", 0)))
          EOF
          )
          echo "collected: $total (floor: $MIN_TESTS)"
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count fell to $total, below the floor of $MIN_TESTS."
            echo "Either tests were deleted, or collection failed silently for part of the suite."
            exit 1
          fi
