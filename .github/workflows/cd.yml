name: CD

# Continuous deployment of the backend (api + celery-worker + celery-beat) to
# the app server in ap-south-1.
#
# HOW A GITHUB RUNNER REACHES A BOX THAT HAS NO INBOUND SSH
# ---------------------------------------------------------
# GitHub OIDC -> an AWS IAM role -> SSM SendCommand. The runner holds no
# long-lived AWS key (the OIDC token is minted per-job and expires in
# minutes), and nothing new is opened inbound: the SSM agent on the instance
# polls OUT to Systems Manager, so port 22 stays shut to the internet.
#
# The alternative -- an SSH private key in a GitHub secret -- was rejected.
# GitHub-hosted runners have dynamic egress across a large published range,
# so SSH-from-Actions means opening 22 to effectively the whole internet on a
# box that terminates four production hostnames. That is a worse security
# posture than the manual deploy it would replace.
#
# WHY THE IMAGE IS BUILT HERE AND NOT ON THE BOX
# ----------------------------------------------
# See deploy/remote-deploy.sh -- short version: the box is a 2 vCPU m6i.large
# serving live traffic with ~1 GB free RAM, and both checkouts under ~/deploy
# can be dirty, so "git pull and build" ships whatever a human left behind.
# (They were dirty when this was written and are clean again now -- see the
# CORRECTION in deploy/remote-deploy.sh. The durable reason is `.env`, which
# lives only on the box and which a `git checkout -f` deploy would delete.)
#
# MIGRATIONS
# ----------
# The api image's CMD is scripts/run_api.sh, which runs `alembic upgrade head`
# and only then starts uvicorn. Deploying the api IS running a migration, and
# a failed migration is a container that boot-loops rather than an error
# anyone sees. Two consequences, both handled in remote-deploy.sh: a pg_dump
# to S3 happens before the swap, and the health gate is 300s because a real
# migration can legitimately take minutes before the port opens.
#
# ROLLBACK
# --------
# Automatic on a failed health check (remote-deploy.sh restores the previous
# image ref and waits for it to come back). Manual: run this workflow with
# workflow_dispatch and set image_tag to an older commit SHA. Note that
# rolling the IMAGE back does not roll a MIGRATION back -- that is what the
# pre-deploy dump is for.
#
# A rollback skips CI (the SHA already passed it on main), so the SHA is
# checked before anything uses it: it must be a full 40-character lowercase
# hex SHA, and it must be an ancestor of origin/main. Anything else -- a branch
# name, a short SHA, a commit that only exists on an unmerged branch, or shell
# metacharacters -- fails the run before checkout. The input only ever reaches
# a shell through `env:`, never as an inline expression inside `run:`.
#
# WHAT THE (PUBLIC) LOG MAY SHOW
# ------------------------------
# These logs are world-readable. Every AWS job starts with a step that
# registers the deploy role ARN, its name, the account id and the instance id
# with `::add-mask::`, so later lines print *** in their place (that includes
# the ECR registry host and anything the box prints). The values come from
# secrets.AWS_DEPLOY_ROLE_ARN / secrets.APP_INSTANCE_ID when set (secrets are
# masked from the first line) and fall back to the repository variables of the
# same name; with the variable fallback the mask step's own env header still
# shows them once. Job outputs carry only the SHA and `repo:tag`, never the
# registry host: GitHub silently drops a job output that contains a masked
# value.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/cd.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (blank = build and deploy this ref). Use an older SHA to roll back."
        required: false
        default: ""

# Never cancel a deploy in flight: a half-applied `docker compose up` is worse
# than a queued one. Deploys serialise instead.
concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  id-token: write   # required to mint the OIDC token
  contents: read
  # Granted at the workflow level because this workflow CALLS ci.yml, and a
  # reusable workflow's jobs cannot request a permission the caller did not
  # grant. ci.yml's notify job asks for `actions: read` (it reads the run's
  # start time to report a duration); without this line every CD run dies with
  # `startup_failure` before a single job is scheduled -- no logs, no jobs, and
  # nothing in the UI that names the missing scope. The deploy jobs below do
  # not use it.
  actions: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: wyfy/api

jobs:
  # Gate on the existing CI rather than restating it. ci.yml gained an
  # `on.workflow_call` trigger for this; the ruff/pytest/test-count-floor
  # steps stay defined in exactly one place.
  #
  # ...unless this exact tree has ALREADY passed it. Merging an up-to-date PR
  # produces a main commit whose tree is byte-identical to the PR's
  # refs/pull/N/merge checkout, which ci.yml just tested end to end; running
  # the same ~25-minute suite again on the same bytes was about half of this
  # repository's Actions minutes. ci.yml leaves a `ci-passed-tree-<tree>`
  # artifact as its last step, only after every gate passed, and this job
  # looks for one.
  #
  # Anything short of an exact tree match runs the full suite as before: main
  # moved between the PR's CI and the merge, a direct push to main, the
  # receipt expired (3 days), the receipt came from a fork, or the API call
  # failed. Setting the repository variable CD_ALWAYS_RUN_CI=true restores
  # the old behaviour without a code change.
  gate:
    name: Was this exact tree already tested?
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Look for a CI receipt for this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ALWAYS_RUN_CI: ${{ vars.CD_ALWAYS_RUN_CI }}
        run: |
          # Never fails: every error path means "not proven, run the suite".
          set -u
          echo "tested=false" >> "$GITHUB_OUTPUT"
          if [ "${ALWAYS_RUN_CI:-}" = "true" ]; then
            echo "CD_ALWAYS_RUN_CI=true; running the full suite."
            exit 0
          fi
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null) || TREE=""
          if ! [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Could not read the tree of $SHA; running the full suite."
            exit 0
          fi
          # Same-repository runs only: a fork's pull_request run can upload
          # artifacts too, and must not be able to vouch for main.
          COUNT=$(gh api "repos/$REPO/actions/artifacts?name=ci-passed-tree-$TREE&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false
                     and .workflow_run.repository_id == .workflow_run.head_repository_id)] | length' \
            2>/dev/null) || COUNT=0
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI reused::Tree $TREE already passed ci.yml ($COUNT receipt(s)); skipping the re-run."
          else
            echo "No CI receipt for tree $TREE; running the full suite."
          fi

  ci:
    name: CI
    needs: gate
    # !cancelled() rather than the default success(): if the gate job itself
    # fails, the answer is "run the suite", not "skip CI and the deploy".
    if: ${{ !cancelled() && github.event.inputs.image_tag == '' && needs.gate.outputs.tested != 'true' }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push to ECR
    needs: [gate, ci]
    if: >-
      ${{ !cancelled() && (
        needs.ci.result == 'success'
        || (needs.gate.outputs.tested == 'true' && needs.ci.result == 'skipped')
        || github.event.inputs.image_tag != ''
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The SHA and repo:tag only. The full ref contains the (masked) account
      # id, and GitHub drops any job output that contains a masked value.
      sha: ${{ steps.meta.outputs.sha }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Mask infrastructure identifiers
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is set neither as a secret nor as a variable."
            exit 1
          fi
          ACCOUNT_ID="$(cut -d: -f5 <<<"$ROLE_ARN")"
          echo "::add-mask::$ROLE_ARN"
          echo "::add-mask::${ROLE_ARN##*/}"
          echo "::add-mask::$ACCOUNT_ID"
          echo "masked: deploy role, role name, account id"

      # Runs BEFORE checkout: nothing touches the input until it is proven to
      # be a bare SHA. Ancestry is checked after checkout, below.
      - name: Validate the rollback SHA
        id: sha
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ]; then
            echo "sha=$DEFAULT_SHA" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character lowercase commit SHA."
            exit 1
          fi
          echo "sha=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "rollback=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          # A rollback needs main's history to prove ancestry; a normal push
          # does not, and a full clone is slower.
          fetch-depth: ${{ steps.sha.outputs.rollback == 'true' && '0' || '1' }}

      - name: Require the rollback SHA to be on main
        if: steps.sha.outputs.rollback == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main. Only commits that were merged to main (and so passed CI there) can be redeployed."
            exit 1
          fi
          echo "rollback target $SHA is on main"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image ref
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          {
            echo "image=$REGISTRY/$ECR_REPOSITORY:$SHA"
            echo "image_name=$ECR_REPOSITORY:$SHA"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      # A workflow_dispatch rollback names a SHA that was already built and
      # pushed. Rebuilding it would be slower and, if a base image moved,
      # would not even produce the same artifact -- so reuse it if it exists.
      - name: Reuse the existing image if this SHA is already in ECR
        id: exists
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
        run: |
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE_NAME already exists; skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          # linux/amd64 only. The instance is x86_64 (m6i.large) and a
          # multi-arch build here would double the build time to produce an
          # arm64 layer nothing pulls.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image can actually start before it is allowed near prod.
      # It cannot reach the real database, so `alembic upgrade head` will fail
      # -- that is expected and not what is being tested. What IS tested is
      # that the interpreter loads the app at all: a syntax error, a missing
      # dependency in requirements.txt, or a bad import shows up here as a
      # non-zero exit in seconds, instead of as a boot-looping container on
      # the production box three minutes later.
      #
      # Deliberately NOT gated on steps.exists.outputs.found. This step used to
      # carry `if: steps.exists.outputs.found == 'false'`, which opened a hole:
      # docker/build-push-action PUSHES as part of the build, so an image whose
      # smoke test then FAILED is already in ECR under that SHA. Re-running the
      # workflow for that SHA found it, skipped the build AND skipped this
      # check, and shipped a known-bad image with nothing left to catch it but
      # the on-box health gate.
      #
      # Running it unconditionally costs one `docker pull` on the reuse path
      # (the ECR login above already authenticated the runner) and makes the
      # rollback path prove the artifact starts, rather than assuming it does
      # because it once got as far as being pushed.
      - name: Smoke-test the image imports
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import app.main; print('app.main imported OK')"

  deploy:
    name: Deploy to app server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Attach required reviewers / a wait timer to this environment in repo
    # settings if backend deploys should need a human. Leaving it with no
    # protection rules makes this fully continuous; the environment exists so
    # that is a setting rather than a rewrite.
    environment:
      name: production
      url: https://app.wyfyguest.com
    steps:
      # Same masking as the build job, plus the instance id. INSTANCE_ID and
      # ACCOUNT_ID go to GITHUB_ENV only after they are masked, so every later
      # step header shows ***.
      - name: Mask infrastructure identifiers
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          # Fallback literal: neither the secret nor the variable exists yet,
          # and CD must keep working until the owner adds one (it was already
          # in this public file before). Delete the fallback once
          # secrets.APP_INSTANCE_ID is set.
          APP_INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID || vars.APP_INSTANCE_ID || 'i-0cf9b79511abe6000' }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is set neither as a secret nor as a variable."
            exit 1
          fi
          if [ -z "$APP_INSTANCE_ID" ]; then
            echo "::error::No app instance id (secret/variable APP_INSTANCE_ID)."
            exit 1
          fi
          ACCOUNT_ID="$(cut -d: -f5 <<<"$ROLE_ARN")"
          echo "::add-mask::$ROLE_ARN"
          echo "::add-mask::${ROLE_ARN##*/}"
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$APP_INSTANCE_ID"
          echo "INSTANCE_ID=$APP_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "masked: deploy role, role name, account id, instance id"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Fail with a sentence a human can act on, rather than with a 60-second
      # SendCommand timeout, when the instance is not registered with SSM.
      # (It was not, on 2026-08-27: the agent runs, but the instance role had
      # no ssm:UpdateInstanceInformation. See the enable-list.)
      - name: Check the instance is registered with SSM
        run: |
          COUNT=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'length(InstanceInformationList)' --output text)
          if [ "$COUNT" != "1" ]; then
            echo "::error::The app instance is not registered with SSM."
            echo "The agent is installed and running on the box; what it needs is"
            echo "AmazonSSMManagedInstanceCore attached to the instance role."
            exit 1
          fi
          aws ssm describe-instance-information --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].{Ping:PingStatus,Agent:AgentVersion,Platform:PlatformName}'

      - name: Send deploy command
        id: send
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          # Rebuilt here rather than passed from the build job: the registry
          # host contains the masked account id, and a job output containing a
          # masked value is dropped.
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$SHA"
          # The script is shipped inside the command payload rather than kept
          # on the box, so the version that runs is always the version in this
          # commit and there is no bootstrap step to forget. base64 keeps the
          # quoting out of the JSON entirely.
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)

          # Runs as ubuntu, not root: ~/deploy and everything in it is
          # ubuntu-owned, and a root-written .deploy.env would break the next
          # deploy. ubuntu is already in the docker group.
          jq -n --arg b64 "$SCRIPT_B64" --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              ("echo \($b64) | base64 -d > /tmp/remote-deploy.sh"),
              "chmod 0755 /tmp/remote-deploy.sh",
              ("sudo -u ubuntu -H env AWS_REGION=ap-south-1 /tmp/remote-deploy.sh api \($image)"),
              "rm -f /tmp/remote-deploy.sh"
            ]
          }' > params.json

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD backend ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy to finish
        id: wait
        env:
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          # 15s of grace: get-command-invocation 400s with InvocationDoesNotExist
          # for a moment after send-command returns.
          sleep 15
          DEADLINE=$(( SECONDS + 900 ))
          STATUS=Pending
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text > deploy-stdout.txt || true
          cat deploy-stdout.txt
          echo "----- stderr -----"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true

          # get-command-invocation truncates at 24,000 characters. If a deploy
          # is being debugged from a truncated log, add an S3 output config to
          # send-command above rather than guessing.
          echo "----- status: $STATUS -----"

          # remote-deploy.sh prints `DEPLOY-WARNING: ...` when it could not
          # read a secret (e.g. AccessDenied on the Slack webhook secret). The
          # deploy itself goes ahead -- an unreadable optional secret must not
          # block shipping -- but it must not be silent either: surface each
          # one as an annotation and in the job summary. The last step of this
          # job turns the run red only when CD_FAIL_ON_SECRET_WARNINGS=true.
          WARNINGS="$(grep -o 'DEPLOY-WARNING: .*' deploy-stdout.txt || true)"
          if [ -n "$WARNINGS" ]; then
            {
              echo "### Deploy finished with secret warnings"
              echo
              echo "The image shipped, but the box could not read one or more secrets, so the feature each one configures is OFF:"
              echo
              while IFS= read -r line; do echo "- ${line#DEPLOY-WARNING: }"; done <<<"$WARNINGS"
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::warning title=Secret not read on the box::${line#DEPLOY-WARNING: }"; done <<<"$WARNINGS"
            echo "secret_warnings=$(grep -c . <<<"$WARNINGS")" >> "$GITHUB_OUTPUT"
          else
            echo "secret_warnings=0" >> "$GITHUB_OUTPUT"
          fi
          [ "$STATUS" = "Success" ] || exit 1

      # Independent of the box's own healthcheck: proves the deployed API is
      # reachable through the real nginx on the real hostname over real TLS,
      # which is what a user experiences. The container reporting healthy and
      # the site being up are not the same claim.
      - name: Verify through the public endpoint
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://app.wyfyguest.com/api/v1/health/live?cb=$(date +%s)" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::app.wyfyguest.com did not return 200 after the deploy."
          echo "The container passed its own healthcheck, so suspect nginx or TLS"
          echo "rather than the image. The previous image is still in ECR:"
          echo "  gh workflow run cd.yml -f image_tag=<previous-sha>"
          exit 1

      # Last, so it can only fire after the deploy and the public check have
      # both passed: the new image IS live. What it reports is that a secret
      # the box needed could not be read (today: the Slack webhook secret, an
      # IAM grant missing on the instance role).
      #
      # Opt-in, not the default. Until that grant exists every run would be
      # red after a deploy that worked, and a run that is always red hides the
      # run that is red for a real reason (and invites rolling back a good
      # deploy). The warning annotations and the job summary above always
      # appear. Set the repository variable CD_FAIL_ON_SECRET_WARNINGS=true
      # once the instance role can read every secret.
      - name: Fail if the box could not read a secret
        if: steps.wait.outputs.secret_warnings != '0' && vars.CD_FAIL_ON_SECRET_WARNINGS == 'true'
        env:
          COUNT: ${{ steps.wait.outputs.secret_warnings }}
        run: |
          echo "::error::$COUNT secret(s) could not be read on the box; see the job summary. The deploy itself succeeded and is live."
          exit 1

  # ---------------------------------------------------------------------------
  # Slack
  # ---------------------------------------------------------------------------
  # EVERY OUTCOME, unlike CI. A deploy is rare, it changes what is serving
  # production traffic, and "it worked" is itself the thing people want to
  # know -- there is no way to tell a successful deploy from one that never
  # started, other than being told.
  #
  # `needs` covers the whole pipeline rather than just `deploy`, because the
  # interesting failures are the ones where deploy never ran: a failed `ci`
  # leaves build and deploy *skipped*, not failed, and a notifier watching
  # only its own outcome would have nothing to say about the run that mattered
  # most. The action folds the per-job results into one status, failure first.
  #
  # Nothing about the deploy above is changed by this job -- it has its own
  # runner, its own (smaller) permissions, no AWS credentials, and it cannot
  # run until deploy has already reached a conclusion.
  notify:
    name: Tell Slack how the deploy went
    needs: [gate, ci, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # Deliberately does not inherit the workflow's `id-token: write`: this job
    # has no business minting an OIDC token for the deploy role.
    permissions:
      actions: read
      contents: read
    steps:
      # The action lives in this repository, so it has to be on disk before it
      # can be used. Sparse-checked-out: this job wants one action.yml, not a
      # backend, a node_modules-sized frontend, or a vendored gateway.
      - name: Check out the composite action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Notify
        uses: ./.github/actions/slack-notify
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          needs_json: ${{ toJSON(needs) }}
          kind: CD
          environment: production
          # Empty when the build job was skipped, which the action handles by
          # leaving the field out rather than printing an empty one.
          # repo:tag, not the registry host (see the masking note at the top).
          image: ${{ needs.build.outputs.image_name }}
          # On a workflow_dispatch rollback the thing that shipped is an older
          # commit than the ref this run is on; say which one it actually was.
          # The validated SHA from the build job; github.sha if build never
          # got that far.
          commit_sha: ${{ needs.build.outputs.sha || github.sha }}
