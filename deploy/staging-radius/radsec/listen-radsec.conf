# STAGING ONLY. sites-enabled/listen-radsec: RADIUS over TLS (RFC 6614).
# Certificates (mounted read-only from ~/deploy/staging-radius/radsec/certs):
#   server.pem  -- Let's Encrypt chain for staging.wyfyguest.com (copied from
#                  certbot by install.sh / the renewal deploy hook). A public CA
#                  because Instant On has no way to upload a private CA.
#   server.key  -- its key
#   trust.pem   -- the ONLY CAs whose client certificates may connect (the
#                  staging test CA, plus whatever device CA gets enrolled).
listen {
	ipaddr = *
	port = 2083
	type = auth+acct
	proto = tcp
	virtual_server = radsec
	clients = radsec
	check_client_connections = yes
	limit {
		max_connections = 256
		lifetime = 0
		idle_timeout = 600
	}
	tls {
		private_key_file = /etc/wyfy-radsec/server.key
		certificate_file = /etc/wyfy-radsec/server.pem
		ca_file = /etc/wyfy-radsec/trust.pem
		require_client_cert = yes
		fragment_size = 8192
		cipher_list = "DEFAULT"
		cipher_server_preference = yes
		tls_min_version = "1.2"
		#  1.2 by default: the client Certificate message is then visible
		#  in a packet capture (radsec-capture.sh), which is how an
		#  unknown device's chain is discovered. Set RADSEC_TLS_MAX=1.3
		#  in radsec.env once the device is enrolled.
		tls_max_version = "$ENV{RADSEC_TLS_MAX}"
		cache {
			enable = no
		}
		ocsp {
			enable = no
		}
	}
}

# Any source address: identity comes from the certificate, never the IP.
# "radsec" is the fixed RADIUS shared secret RFC 6614 uses inside TLS.
clients radsec {
	client radsec-any-v4 {
		ipaddr = 0.0.0.0/0
		proto = tls
		secret = radsec
		shortname = radsec-unidentified
		require_message_authenticator = no
	}
}
