# Security headers for every wyfyguest.com server block on the app box
# (app, master, demo, portal, wifi, auth, automation).
#
# Install (full steps and verification are in the PR that added this file):
# copy to /etc/nginx/snippets/wyfy-security-headers.conf and `include` it
# inside each `server { listen 443 ... }` block.
#
# TARGET: the SPA `location / { proxy_pass http://127.0.0.1:3000; }` blocks.
# Pentest 2026-11-06 found the SPA hosts (app, master, auth/portal, wifi,
# demo) send no security headers at all while /api/v1 does (the API sets its
# own). Including at server level covers `location /` only if that location
# has no add_header of its own; if it does, include this file inside it.
#
# NGINX INHERITANCE TRAP: add_header is inherited from server{} into a
# location{} ONLY if that location has no add_header of its own. Any location
# that sets its own add_header (a cache header, CORS, ...) -- or its own
# proxy_hide_header -- must include this file again, or it silently serves
# none of these.
#
# CAPTIVE PORTAL SAFETY. portal./wifi./auth. pages are opened inside the OS
# captive mini-browser (Apple CNA, Android captive portal app, Windows) and
# then submit to the ROUTER's plain-HTTP login URL. Therefore:
#   * no X-Frame-Options / frame-ancestors here -- those live in
#     security-headers-noframe.conf, included on app./master./demo. only;
#   * the CSP restricts nothing about forms (no form-action) and is
#     REPORT-ONLY: it logs violations in the browser console and blocks
#     nothing, so it cannot break the SPA or the portal. Promote it to an
#     enforcing Content-Security-Policy only after a clean soak, host by host;
#   * HSTS only affects https://<these hosts>; the router's http:// login URL
#     is a different host (an IP or the hotspot DNS name), so it is untouched.

# The API (FastAPI) already sends some of these on /api/ responses. Hide the
# upstream copies so each header is sent exactly once (by nginx). Only the
# headers this file sets are hidden; any upstream CSP or X-Frame-Options is
# left alone.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

# One year, subdomains included. Not `preload`: preloading is a one-way
# commitment for the whole apex and is the website owner's call.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only features nothing in the SPA or the portal uses. clipboard-write,
# fullscreen, payment and geolocation are deliberately NOT listed (the SPA
# copies keys/scripts to the clipboard; a payment checkout may need payment).
add_header Permissions-Policy "camera=(), microphone=(), usb=(), serial=(), bluetooth=()" always;
# Report-Only. Deliberately no form-action and no frame-ancestors (see above).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://*.wyfyguest.com; frame-src 'self' https://www.youtube.com https://www.google.com; object-src 'none'; base-uri 'self'" always;
