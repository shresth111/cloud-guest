# Anti-clickjacking for the console hosts ONLY: app., master., demo.
#
# Include it NEXT TO security-headers.conf in those server blocks. Never in
# portal./wifi./auth.: captive-portal pages may be shown inside another frame
# (a venue's own page, a vendor controller), and DENY there would blank the
# login page.
#
# X-Frame-Options rather than an enforcing CSP frame-ancestors, so the only
# CSP on these hosts stays the Report-Only one. The API already sends
# X-Frame-Options: DENY on /api/ responses; hide that copy so it is sent once.
proxy_hide_header X-Frame-Options;
add_header X-Frame-Options "DENY" always;
