# automation.wyfyguest.com (n8n): expose ONLY real production webhook calls.
#
# Pentest 2026-11-06: the UI is correctly 403, but the whole /webhook/ prefix
# was proxied, so GET /webhook/ returned n8n's SPA index, whose base64 meta
# tag disclosed the exact n8n release and environment=development.
#
# Install: replace the existing `location /webhook/ { ... }` in the
# automation server block with the blocks below (keep the server-level
# `location / { return 403; }` and the security-headers include). Then
# `nginx -t && systemctl reload nginx`. Upstream port matches the current
# box config (n8n on 127.0.0.1:5678).

# Bare prefix (the index page that leaked the version) and anything that is
# not a plain /webhook/<id-or-path>: nothing to see here.
location = /webhook/ { return 404; }
location = /webhook  { return 404; }

# Test and "waiting" webhooks are an editor-session feature; never public.
location ^~ /webhook-test/    { return 404; }
location ^~ /webhook-waiting/ { return 404; }

# A real webhook: /webhook/<segment>[/<segment>...], letters, digits, - and _
# only. Everything else under /webhook/ falls through to the 404 below.
location ~ "^/webhook/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$" {
    include /etc/nginx/snippets/wyfy-security-headers.conf;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never let an n8n error page or the SPA shell ride out on a webhook path.
    proxy_intercept_errors on;
    error_page 404 =404 /__wyfy_404;
}
# Plain prefix, NOT ^~: a ^~ match here would stop nginx from trying the
# regex above, and every real webhook would 404.
location /webhook/ { return 404; }
location = /__wyfy_404 { internal; return 404; }
