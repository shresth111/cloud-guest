# CWMP edge for GenieACS (TASKS FS-4, API_CONTRACT §5.1 / §6.5).
#
# Install on the STAGING box only (see DEPLOY.md):
#   /etc/nginx/sites-available/wyfy-acs-staging.conf -> sites-enabled/
#   /etc/nginx/wyfy/acs-gate.conf  (root:root 0600, from nginx-acs-gate.conf.example)
# The prod copy (acs.wyfyguest.com) is the same file with the server_name and
# certificate paths changed, and waits for founder sign-off (STATUS Q5).
#
# Flow for every CWMP request:
#   CPE --HTTPS Basic--> nginx :443
#     auth_request /_acs_auth --GET--> api 127.0.0.1:8000/api/v1/internal/tr069/acs-auth
#        (forwards only the CPE's Authorization + the gate secret; no body)
#        204 -> request continues to GenieACS cwmp on 127.0.0.1:7547
#        401 -> CPE gets 401 + WWW-Authenticate: Basic; GenieACS never sees it
#        anything else (api down, 404 = gate secret wrong) -> 500 to the CPE,
#        which retries at its next periodic inform. Fail closed.
# GenieACS itself runs with `cwmp.auth` unset, which accepts every session
# (verified in the 1.2.16 source: `if (cwmp.auth == null) return true`).

# Brute-force brake on the credential check. Generous on purpose: an ISP's
# whole fleet can sit behind a handful of CGNAT addresses, and one CWMP
# session is ~5-20 requests in a few seconds.
limit_req_zone $binary_remote_addr zone=wyfy_acs:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name acs-staging.wyfyguest.com;

    # certbot's nginx authenticator injects the HTTP-01 challenge here on
    # issue and renewal, like the existing staging.wyfyguest.com lineage.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name acs-staging.wyfyguest.com;

    # RSA key on purpose (certbot --key-type rsa): the MikroTik script trusts
    # ISRG Root X1 only (API_CONTRACT §5, step 2), and RSA leaves chain to X1.
    ssl_certificate     /etc/letsencrypt/live/acs-staging.wyfyguest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acs-staging.wyfyguest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/wyfy-acs.access.log;
    error_log  /var/log/nginx/wyfy-acs.error.log warn;

    client_max_body_size 5m;

    # Never let this host proxy into the API or anything else on the box.
    location ^~ /api/ { return 404; }

    location / {
        limit_req zone=wyfy_acs burst=200 nodelay;
        limit_req_status 429;

        auth_request /_acs_auth;
        auth_request_set $wyfy_acs_user $upstream_http_x_wyfy_acs_user;

        proxy_pass http://127.0.0.1:7547;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # RFC 7239; GenieACS trusts it from 172.16.0.0/12 only
        # (GENIEACS_FORWARDED_HEADER in docker-compose.acs.yml).
        proxy_set_header Forwarded "for=$remote_addr;proto=https;host=$host";
        proxy_set_header X-Wyfy-Acs-User $wyfy_acs_user;
        # The edge already authenticated. Do not hand the CPE's credential to
        # GenieACS, so it can never land in a GenieACS debug log.
        # (Fallback mode B in genieacs-config.md needs this line removed.)
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # CWMP sessions are cookie-correlated (`session=` cookie); pass it
        # through untouched. No proxy buffering surprises for SOAP bodies.
        proxy_buffering off;
    }

    location = /_acs_auth {
        internal;
        # The backend route is GET; a subrequest otherwise inherits the CPE's
        # POST and would 405.
        proxy_method GET;
        proxy_pass http://127.0.0.1:8000/api/v1/internal/tr069/acs-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        # Sets: proxy_set_header X-Wyfy-Acs-Gate "<TR069_EDGE_SHARED_SECRET>";
        include /etc/nginx/wyfy/acs-gate.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    error_page 401 = @acs401;
    location @acs401 {
        add_header WWW-Authenticate 'Basic realm="wyfy-acs"' always;
        return 401;
    }
}
