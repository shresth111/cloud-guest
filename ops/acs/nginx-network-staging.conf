# network-staging.wyfyguest.com: the ISP partner console host (TASKS FS-5).
#
# A third hostname of the SAME SPA. It mirrors the staging SPA block in
# /etc/nginx/sites-available/default (read 2026-10-22) exactly: same upstreams
# (frontend 127.0.0.1:3000, api 127.0.0.1:8000), same radius guard. The SPA
# picks the partner console by hostname (src/lib/isp-partner/network-host.ts),
# so nginx needs no routing logic of its own.
#
# The SPA calls the API same-origin (/api/v1, relative), so no CORS origin
# needs adding. Verified: VITE_API_BASE_URL is the relative "/api/v1".
#
# Install on the STAGING box only, as sites-available/wyfy-network-staging.conf.

server {
    listen 80;
    listen [::]:80;
    server_name network-staging.wyfyguest.com;
    # certbot's nginx authenticator injects the HTTP-01 challenge here on
    # issue and renewal, like the existing staging.wyfyguest.com lineage.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name network-staging.wyfyguest.com;

    ssl_certificate     /etc/letsencrypt/live/network-staging.wyfyguest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/network-staging.wyfyguest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Same guard as the staging default block.
    location ~ ^/api/v1/radius/(?!nas(/|$)) {
        return 404;
    }
    # The CWMP edge's credential check is for nginx's auth_request only.
    location ^~ /api/v1/internal/tr069/ {
        return 404;
    }

    # REQUIRED (CONTRACT_CHANGES #11): routers set up from the partner app get
    # https://network-staging.wyfyguest.com/api/v1 baked into their check-in
    # and heartbeat commands (getAbsoluteApiBase()). Never narrow this block.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
